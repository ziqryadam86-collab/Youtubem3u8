      - name: Fetch M3U8 and Update File
        env:
          # Gunakan link video yang paling ringkas sahaja
          YT_URL: "https://www.youtube.com/watch?v=HgWz05AsLxw"
        run: |
          # Cuba dapatkan link dengan format 'best' dan print error ke log
          echo "Sedang mencari stream untuk: $YT_URL"
          M3U8_URL=$(yt-dlp -f "hls-240" -g "$YT_URL" || yt-dlp -f "hls" -g "$YT_URL")
          
          # Jika masih kosong, cuba cara tanpa format (biar yt-dlp pilih)
          if [ -z "$M3U8_URL" ]; then
            M3U8_URL=$(yt-dlp -g "$YT_URL" | grep "m3u8" | head -n 1)
          fi

          if [ -z "$M3U8_URL" ]; then
            echo "Gagal total mendapatkan m3u8. Sila semak sama ada video ini LIVE atau tidak."
            exit 1
          fi
          
          echo "#EXTM3U" > index.m3u8
          echo "#EXT-X-STREAM-INF:BANDWIDTH=390000,CODECS=\"avc1.4d0015,mp4a.40.2\",RESOLUTION=426x240" >> index.m3u8
          echo "$M3U8_URL" >> index.m3u8
          
