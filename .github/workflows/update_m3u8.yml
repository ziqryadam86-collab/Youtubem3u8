      - name: Fetch M3U8 and Update File
        env:
          YT_URL: "https://m.youtube.com/watch?v=HgWz05AsLxw"
        run: |
          # Dapatkan URL m3u8 dan simpan ke pembolehubah
          # Kita gunakan 2>/dev/null untuk sembunyikan ralat ke skrin
          M3U8_URL=$(yt-dlp -f "hls" -g "$YT_URL" 2>/dev/null)
          
          # Semak jika M3U8_URL kosong atau tidak dijumpai
          if [ -z "$M3U8_URL" ]; then
            echo "Error: Gagal mendapatkan pautan m3u8. Tidak akan mengemaskini fail."
            exit 0 # Keluar dengan jayanya supaya workflow tidak dikira 'failed'
          else
            # Jika berjaya, baru tulis ke fail
            echo "#EXTM3U" > index.m3u8
            echo "#EXT-X-STREAM-INF:BANDWIDTH=390000,CODECS=\"avc1.4d0015,mp4a.40.2\",RESOLUTION=426x240" >> index.m3u8
            echo "$M3U8_URL" >> index.m3u8
            echo "Berjaya mengemaskini fail."
          fi
          
